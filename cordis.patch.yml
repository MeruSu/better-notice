# Bundle patch: one row for dsh-better-notice.
# The host half registers the /hotlist-sound prefix route so the client can load
# the bundled sound cues (the shared package-asset route only serves images, so
# .wav/.mp3 would 404 there). The client half (dsh.client) registers one tab per
# hot session in the conversation view tab row, plus the sidebar markers, the
# popout overlay and the settings page.
- insert:
    - id: hotlist
      name: 'dsh-better-notice'
